# This is an example .goreleaser.yml file.
# Make sure to review and customize it to your needs.
# For more information, see: https://goreleaser.com/customization/
version: 2
project_name: gherkio

before:
  hooks:
    - go mod tidy

builds:
  - id: gherkio
    main: .
    binary: gherkio
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/muhfaris/gherkio/cmd.Version={{.Version}} -X github.com/muhfaris/gherkio/cmd.Commit={{.Commit}} -X github.com/muhfaris/gherkio/cmd.BuildDate={{.Date}}

archives:
  - id: gherkio
    builds:
      - gherkio
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - 'merge'
      - 'Merge'