name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o gherkio .

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate Gherkio Showcase
        run: ./gherkio validate

      - name: Run Gherkio Showcase Suite
        run: ./gherkio run --env mocked

      - name: Run Gherkio Load Showcase
        run: >-
          ./gherkio run .gherkio/tests/showcase/05_repeat_until.yaml
          --env mocked --virtual-users 2 --iterations-per-user 2
