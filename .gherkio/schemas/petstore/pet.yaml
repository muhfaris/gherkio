type: object
required:
    - name
    - photoUrls
properties:
    category:
        type: object
        properties:
            id:
                type: integer
            name:
                type: string
    id:
        type: integer
    name:
        type: string
    photoUrls:
        type: array
        items:
            type: string
    status:
        type: string
    tags:
        type: array
        items:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
