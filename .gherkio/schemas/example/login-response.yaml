type: object
required:
  - accessToken
  - refreshToken
  - id
  - username
  - email
properties:
  accessToken:
    type: string
  refreshToken:
    type: string
  id:
    type: integer
  username:
    type: string
  email:
    type: string
    format: email
  firstName:
    type: string
  lastName:
    type: string
  gender:
    type: string
  image:
    type: string
