scenario: Pet to Order — Full E2E Workflow
setup:
    - request:
        method: POST
        url: /pet
        headers:
            Content-Type: application/json
        body:
            category:
                id: 2
                name: Cats
            name: E2E Buddy
            photoUrls:
                - https://example.com/e2e-buddy.jpg
            status: available
            tags:
                - id: 3
                  name: playful
      expect:
        status: 200
        body.category.name: Cats
        body.name: E2E Buddy
        body.status: available
        schema: petstore/pet
      save:
        setup_petId: body.id
        setup_petName: body.name
      timing:
        max: 4s
steps:
    - request:
        method: POST
        url: /store/order
        headers:
            Content-Type: application/json
        body:
            complete: false
            petId: $setup_petId
            quantity: 1
            shipDate: ${dateNow("2006-01-02T15:04:05.000Z")}
            status: placed
      expect:
        status: 200
        body.complete: false
        body.petId: $setup_petId
        body.quantity: 1
        body.status: placed
        schema: petstore/order
      save:
        step2_orderId: body.id
        step2_orderPetId: body.petId
      timing:
        max: 4s
    - request:
        method: GET
        url: /store/inventory
      expect:
        status: 200
      save:
        step3_inventory: body
      timing:
        max: 5s
teardown:
    - request:
        method: DELETE
        url: /store/order/$step2_orderId
      expect:
        status: 200
        body.code: 200
        body.message: string
        schema: petstore/api-response
      timing:
        max: 3s
