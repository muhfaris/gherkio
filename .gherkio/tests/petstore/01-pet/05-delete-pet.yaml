scenario: Delete a Pet (DELETE)
steps:
    - request:
        method: DELETE
        url: /pet/1
      expect:
        status: 200
        schema: petstore/api-response
      timing:
        max: 3s
    - request:
        method: GET
        url: /pet/999999999
      expect:
        status: 404
        body.code: 1
        body.message: contains "not found"
        schema: petstore/api-response
      timing:
        max: 3s
