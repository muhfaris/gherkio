scenario: Find Pets by Status (Query Parameter + Collection Matchers)
steps:
    - request:
        method: GET
        url: /pet/findByStatus?status=available
      expect:
        status: 200
      timing:
        max: 5s
    - request:
        method: GET
        url: /pet/findByStatus?status=available&status=sold
      expect:
        status: 200
      timing:
        max: 5s
    - request:
        method: GET
        url: /pet/findByStatus?status=lost
      expect:
        status: 200
      timing:
        max: 3s
