scenario: Get Pet by ID (GET with Path Parameter)
steps:
    - request:
        method: GET
        url: /pet/$step1_petId
      expect:
        status: 200
        all(body.photoUrls): string
        all(body.tags): object
        body.category: object
        body.category.id: number
        body.category.name: string
        body.id: $step1_petId
        body.name: string
        body.photoUrls: array
        body.status: string
        body.tags: array
        schema: petstore/pet
      save:
        step2_petStatus: body.status
        step2_retrievedPetId: body.id
      timing:
        max: 3s
