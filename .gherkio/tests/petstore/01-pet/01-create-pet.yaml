scenario: Create a Pet (Basic POST)
steps:
    - request:
        method: POST
        url: /pet
        headers:
            Content-Type: application/json
        body:
            category:
                id: 1
                name: Dogs
            id: $randomInt
            name: Buddy
            photoUrls:
                - https://example.com/buddy-1.jpg
                - https://example.com/buddy-2.jpg
            status: available
            tags:
                - id: 1
                  name: friendly
                - id: 2
                  name: trained
      expect:
        status: 200
        all(body.photoUrls): string
        body.category.name: Dogs
        body.id: number
        body.name: Buddy
        body.photoUrls: array
        body.status: available
        count(body.tags): 2
        schema: petstore/pet
      save:
        step1_categoryName: body.category.name
        step1_petId: body.id
        step1_petName: body.name
      timing:
        max: 4s
