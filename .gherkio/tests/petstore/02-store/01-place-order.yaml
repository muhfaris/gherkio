scenario: Place an Order (Store POST)
steps:
    - request:
        method: POST
        url: /store/order
        headers:
            Content-Type: application/json
        body:
            complete: false
            petId: 1
            quantity: ${randomInt(1,5)}
            shipDate: ${dateNow("2006-01-02T15:04:05.000Z")}
            status: placed
      expect:
        status: 200
        body.complete: false
        body.id: number
        body.petId: 1
        body.quantity: number
        body.shipDate: string
        body.status: placed
        schema: petstore/order
      save:
        1-orderId: body.id
        1-orderPetId: body.petId
        1-orderQuantity: body.quantity
        1-orderStatus: body.status
      timing:
        max: 4s
