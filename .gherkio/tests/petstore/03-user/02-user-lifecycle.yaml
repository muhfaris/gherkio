scenario: User Lifecycle (Setup/Steps/Teardown)
setup:
    - request:
        method: POST
        url: /user
        headers:
            Content-Type: application/json
        body:
            email: $randomEmail
            firstName: Lifecycle
            lastName: Test
            password: testP@ss456
            phone: +1-555-${randomInt}
            username: lifecycle_${randomInt}
      expect:
        status: 200
        body.code: 200
        schema: petstore/api-response
steps:
    - request:
        method: GET
        url: /pet/3
      expect:
        status: 200
        body.id: 3
        body.name: string
        body.status: string
      timing:
        max: 3s
    - request:
        method: GET
        url: /pet/findByStatus?status=available
      expect:
        status: 200
      timing:
        max: 4s
teardown:
    - request:
        method: GET
        url: /user/logout
      expect:
        status: 200
      timing:
        max: 3s
