scenario: User Login and Logout (Query Parameters)
steps:
    - request:
        method: GET
        url: /user/login?username=testuser&password=testpass
      expect:
        status: 200
        body.code: number
        body.message: string
        body.type: unknown
      save:
        step1_sessionToken: body.message
      timing:
        max: 3s
    - request:
        method: GET
        url: /user/logout
      expect:
        status: 200
        body.code: number
        body.message: string
        body.type: unknown
      timing:
        max: 3s
