
scenario: Demonstrate Gherkio Matchers capabilities

steps:
  - request:
      service: restful-api
      method: GET
      url: /objects/7
      
    expect:
      status: 200
      body.id: string
      body.name: contains MacBook
      body.data.year: number
      body.data.price: exists

    timing:
      max: 2s
