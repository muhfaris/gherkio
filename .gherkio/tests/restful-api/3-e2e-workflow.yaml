scenario: Complete E2E Object Workflow

steps:
  # 1. Use the reusable test file to create an object and get its ID
  - use: 1-create-a-new-object.yaml

  # 2. Get the created object using the extracted $created_id
  - request:
      service: restful-api
      method: GET
      url: /objects/$created_id
      
    expect:
      status: 200
      body.name: "Apple MacBook Pro 16"
      schema: restful-api/object-schema

  # 3. Update the object
  - request:
      service: restful-api
      method: PUT
      url: /objects/$created_id
      headers:
        Content-Type: application/json
      body:
        name: "Apple MacBook Pro 16 - M3 Max"
        data:
          year: 2024
          price: 2699.99
          "CPU model": "M3 Max 16-Core"
          color: "Space Black"

    expect:
      status: 200
      body.name: "Apple MacBook Pro 16 - M3 Max"
      body.data.price: 2699.99

  # 4. Delete the object
  - request:
      service: restful-api
      method: DELETE
      url: /objects/$created_id

    expect:
      status: 200
      body.message: contains deleted
