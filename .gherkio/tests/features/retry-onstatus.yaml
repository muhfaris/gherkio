scenario: retry with onStatus

# Demonstrates the onStatus retry option.
# This request succeeds immediately, but the onStatus: [503]
# configuration would ONLY retry if the server returned 503.

steps:
  - request:
      method: GET
      url: /products/1

    retry:
      attempts: 3
      interval: 500
      onStatus: [503]

    expect:
      status: 200
      body.title: string

    timing:
      max: 10s
