scenario: JWT claim assertions

# Demonstrates decoding JWT tokens and asserting claims.
# The login step returns an accessToken which Gherkio auto-decodes.
# Claims from the decoded JWT are available via jwt.<claim> paths.

steps:
  - request:
      method: POST
      url: /auth/login
      body:
        username: emilys
        password: emilyspass
        expiresInMins: 30

    expect:
      status: 200

      # The response contains accessToken — Gherkio decodes it automatically
      # and makes its claims available via jwt.<claim> assertions.
      body.accessToken: exists
      body.refreshToken: exists

      # Basic JWT structure checks
      jwt.id: exists
      jwt.username: exists
      jwt.email: email

    save:
      accessToken: body.accessToken

    timing:
      max: 10s
