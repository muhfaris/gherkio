scenario: variable defaults

# Demonstrates the ${var:default} syntax for variable interpolation.
# This is useful when a variable may or may not be set by a previous step.

steps:
  # This request uses a variable $productId that doesn't exist yet.
  # With ${productId:1}, it falls back to "1" if the variable is missing.
  - request:
      method: GET
      url: /products/${productId:1}

    expect:
      status: 200
      body.id: number

    save:
      fallbackId: body.id

  # Now try with a variable that exists — it should use the real value
  - request:
      method: GET
      url: /products/$fallbackId

    expect:
      status: 200
      body.id: 1

  # If a variable is defined, the default is ignored
  - request:
      method: GET
      url: /products/${fallbackId:999}

    expect:
      status: 200
      body.id: 1
