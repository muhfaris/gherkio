scenario: nested path assertions and deep schema

# Demonstrates accessing deeply nested JSON fields and
# validating nested structures with schema assertions.

steps:
  - request:
      method: GET
      url: /products/1

    expect:
      status: 200

      # Deeply nested field access
      body.dimensions.width: number
      body.dimensions.height: number
      body.dimensions.depth: number

      # Array element access by index
      body.tags[0]: string
      body.tags[1]: string
      body.reviews[0].rating: number
      body.reviews[0].comment: string
      body.reviews[0].reviewerName: string

      # Nested object inside meta
      body.meta.createdAt: datetime
      body.meta.barcode: string

      # Schema validation on the full response
      schema: features/product-response

    timing:
      max: 5s
