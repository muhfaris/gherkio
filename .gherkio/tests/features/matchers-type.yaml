scenario: matchers — type checking

# Demonstrates Gherkio's type matchers against DummyJSON product data.

steps:
  - request:
      method: GET
      url: /products/1

    expect:
      status: 200

      # Numeric type checks
      body.id: number
      body.price: number
      body.rating: number
      body.discountPercentage: number

      # String type checks
      body.title: string
      body.description: string
      body.brand: string

      # Array type checks
      body.tags: array
      body.images: array
      body.reviews: array

      # Object type checks
      body.dimensions: object
      body.meta: object

      # Datetime format check (RFC3339)
      body.meta.createdAt: datetime
      body.meta.updatedAt: datetime

    timing:
      max: 5s
