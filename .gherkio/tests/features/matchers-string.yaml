scenario: matchers — string patterns (contains, startsWith, endsWith, regex)

# Demonstrates Gherkio's string pattern matchers.
# These are in a separate file to avoid YAML duplicate key issues.

steps:
  - request:
      method: GET
      url: /products/1

    expect:
      status: 200

      # contains — substring anywhere in the value
      body.description: contains Mascara

      # startsWith — value starts with prefix
      body.title: startsWith Essence

      # endsWith — value ends with suffix
      body.sku: endsWith 001

      # regex — full regex pattern match
      body.meta.barcode: regex ^\d{13}$

    timing:
      max: 5s
