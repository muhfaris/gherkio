scenario: "negative assertions demo (schema: not, not exists)"

# Demonstrates RFC-11 negative assertions.
# All assertions here are PASSING — no intentional failures.

steps:
  # Schema: not — product data should NOT match login-response schema
  - request:
      method: GET
      url: /products/1
    expect:
      status: 200
      schema: not example/login-response

  # Schema: not — product data SHOULD match product-response schema
  - request:
      method: GET
      url: /products/1
    expect:
      status: 200
      schema: features/product-response

  # not exists — field should NOT exist in the response
  - request:
      method: GET
      url: /products/1
    expect:
      status: 200
      body.deletedAt: not exists
      body.nonExistent: not exists

  # Regular positive assertions still work
  - request:
      method: GET
      url: /products/1
    expect:
      status: 200
      body.id: exists
      body.title: string
