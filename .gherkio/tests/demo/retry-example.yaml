scenario: retry example with polling

steps:
  # This request will likely succeed on first attempt (no retry shown)
  # Retry info only appears when retries > 0
  - request:
      method: GET
      url: /products/1

    retry:
      attempts: 3
      interval: 500
      backoff: constant

    expect:
      status: 200
      body.id: exists

    timing:
      max: 5s
