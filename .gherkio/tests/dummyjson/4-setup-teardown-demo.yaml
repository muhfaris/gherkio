scenario: setup and teardown example (DummyJSON)

# Note: DummyJSON is a mock API — POST/DELETE return fake responses.
# Setup creates a mock product, teardown deletes it.
# This demonstrates the setup/teardown lifecycle, not real persistence.

setup:
  - request:
      method: POST
      url: /products/add
      headers:
        Content-Type: application/json
      body:
        title: "Temporary Product"
        price: 99.99

    expect:
      status: 201
      body.id: exists

    save:
      tempId: body.id

steps:
  - request:
      method: GET
      url: /products/1

    expect:
      status: 200
      body.title: string

  - request:
      method: PUT
      url: /products/1
      headers:
        Content-Type: application/json
      body:
        title: "Updated Product"

    expect:
      status: 200
      body.title: "Updated Product"

teardown:
  - request:
      method: DELETE
      url: /products/1

    expect:
      status: 200
      body.isDeleted: true
