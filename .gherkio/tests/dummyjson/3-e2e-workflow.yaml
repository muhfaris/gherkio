scenario: Complete E2E Product Workflow

# Note: DummyJSON is a mock API — POST/PUT/DELETE return fake responses
# but don't actually persist data. This workflow tests each endpoint independently.

steps:
  # 1. Create a product (mock POST returns a generated response)
  - request:
      method: POST
      url: /products/add
      headers:
        Content-Type: application/json
      body:
        title: "Test Laptop"
        price: 1999.99

    expect:
      status: 201
      body.id: exists
      body.title: "Test Laptop"

  # 2. Get an existing product (real data)
  - request:
      method: GET
      url: /products/1

    expect:
      status: 200
      body.title: string
      body.price: number

  # 3. Update an existing product (mock PUT returns updated fields)
  - request:
      method: PUT
      url: /products/1
      headers:
        Content-Type: application/json
      body:
        title: "Updated Laptop"
        price: 2499.99

    expect:
      status: 200
      body.title: "Updated Laptop"

  # 4. Delete an existing product (mock DELETE returns deleted fields)
  - request:
      method: DELETE
      url: /products/1

    expect:
      status: 200
      body.isDeleted: true
