scenario: Test variable interpolation

steps:
  # First step: Login and save the token
  - request:
      method: POST
      url: /auth/login
      body:
        email: admin@test.com
        password: secret

    expect:
      status: 200
      body.token: exists

    save:
      auth_token: body.token

  # Second step: Use the saved token in the Authorization header
  - request:
      method: GET
      url: /api/user/profile
      headers:
        Authorization: "Bearer $auth_token"
        X-Request-ID: "test-${auth_token:default123}"

    expect:
      status: 200
      body.name: exists

  # Third step: Use the token in the URL and body
  - request:
      method: POST
      url: /api/user/preferences?token=$auth_token
      body:
        user_id: 123
        auth: $auth_token
        settings:
          theme: dark
          notifications: true

    expect:
      status: 200
      body.success: true
